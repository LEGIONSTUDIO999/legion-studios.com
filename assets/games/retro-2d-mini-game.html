<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RETRO 2D MINI-GAME | LEGION STUDIOS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030806;color:#9aff65;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{width:100%;padding:12px 18px;border-bottom:1px solid #24552c;background:#06110a}a{color:#9aff65}h1{font-size:16px;letter-spacing:2px;margin:0}
main{width:min(96vw,680px);padding:14px}canvas{display:block;margin:auto;max-width:100%;height:auto;border:1px solid #377b38;box-shadow:0 0 24px #143d1d;background:#050908;touch-action:none}
.note{color:#9bb99b;font-size:12px;text-align:center;line-height:1.5}
</style></head><body><header><h1>RETRO 2D MINI-GAME</h1></header><main><canvas id="gameCanvas" width="400" height="400" tabindex="0"></canvas><p class="note">Click the game to focus it. Keyboard controls are shown in the game.</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/processing.js/1.6.6/processing.min.js"></script>
<script>
var sketchProc = function(processing) {
  with (processing) {
    size(400, 400);
    frameRate(60);
// Retro 2D Fortnite-Style Mini-Game (Khan Academy ProcessingJS)

var player = {};
var bullets = [];
var enemies = [];
var walls = [];
var score = 0;
var gameOver = false;
var paused = false;

// Pause button bounds (top-right)
var pauseBtn = {
    x: 318,
    y: 8,
    w: 74,
    h: 26
};

function spawnEnemy() {
    var angle = random(0, TWO_PI);
    var distFromCenter = random(90, 170);
    enemies.push({
        x: constrain(200 + cos(angle) * distFromCenter, 24, 376),
        y: constrain(200 + sin(angle) * distFromCenter, 24, 376),
        size: 22,
        speed: random(0.8, 1.45),
        hp: 30,
        walkFrame: random(0, 10)
    });
}

function resetGame() {
    player = {
        x: 200,
        y: 200,
        size: 22,
        speed: 3,
        hp: 100,
        mats: 50,
        cooldown: 0,
        walkFrame: 0
    };
    bullets = [];
    enemies = [];
    walls = [];
    score = 0;
    gameOver = false;
    paused = false;

    for (var i = 0; i < 4; i++) {
        spawnEnemy();
    }
}

resetGame();

// Draws a blocky retro pixel-art person rotated by aimAngle
function drawRetroPerson(x, y, aimAngle, walkPhase, primaryCol, accentCol, skinCol, isPlayer) {
    pushMatrix();
    translate(x, y);
    rotate(aimAngle);
    noStroke();

    var stride = sin(walkPhase) * 3;

    // Retro feet / boots
    fill(35, 35, 45);
    rect(-6 + stride, -9, 6, 5);
    rect(-6 - stride, 4, 6, 5);

    // Blocky torso / shoulders
    fill(primaryCol);
    rect(-7, -9, 14, 18);

    // Accent vest / stripe
    fill(accentCol);
    rect(-3, -7, 5, 14);

    // Weapon arm & gun barrel
    fill(skinCol);
    rect(4, 3, 7, 4);
    fill(70, 75, 85);
    rect(8, 3, 12, 4);

    // Retro square head
    fill(skinCol);
    rect(-5, -6, 11, 12);

    // Hair / helmet / headband
    if (isPlayer) {
        fill(accentCol);
        rect(-6, -7, 12, 3);
        fill(primaryCol);
        rect(-6, -4, 4, 8);
    } else {
        fill(45, 25, 25);
        rect(-6, -7, 12, 4);
    }

    // Eyes facing forward (+X)
    fill(20, 20, 25);
    rect(2, -4, 3, 2);
    rect(2, 2, 3, 2);

    popMatrix();
}

function drawPlayer() {
    var aimAngle = atan2(mouseY - player.y, mouseX - player.x);
    drawRetroPerson(
        player.x,
        player.y,
        aimAngle,
        player.walkFrame,
        color(30, 145, 255),
        color(255, 215, 40),
        color(250, 195, 145),
        true
    );
}

function updatePlayer() {
    var moved = false;
    if (keyIsPressed) {
        if (key === 'w' || key === 'W' || keyCode === UP) {
            player.y -= player.speed;
            moved = true;
        }
        if (key === 's' || key === 'S' || keyCode === DOWN) {
            player.y += player.speed;
            moved = true;
        }
        if (key === 'a' || key === 'A' || keyCode === LEFT) {
            player.x -= player.speed;
            moved = true;
        }
        if (key === 'd' || key === 'D' || keyCode === RIGHT) {
            player.x += player.speed;
            moved = true;
        }
    }

    if (moved) {
        player.walkFrame += 0.35;
    } else {
        player.walkFrame = 0;
    }

    // Keep player inside canvas
    player.x = constrain(player.x, player.size / 2, width - player.size / 2);
    player.y = constrain(player.y, player.size / 2, height - player.size / 2);

    if (player.cooldown > 0) {
        player.cooldown--;
    }

    // Shoot on mouse press (ignore clicks on the pause button)
    var overPause = mouseX >= pauseBtn.x && mouseX <= pauseBtn.x + pauseBtn.w &&
                    mouseY >= pauseBtn.y && mouseY <= pauseBtn.y + pauseBtn.h;

    if (mouseIsPressed && !overPause && player.cooldown === 0) {
        var angle = atan2(mouseY - player.y, mouseX - player.x);
        bullets.push({
            x: player.x + cos(angle) * 16,
            y: player.y + sin(angle) * 16,
            vx: cos(angle) * 7,
            vy: sin(angle) * 7,
            life: 60
        });
        player.cooldown = 10;
    }
}

function togglePause() {
    if (!gameOver) {
        paused = !paused;
    }
}

function mousePressed() {
    if (mouseX >= pauseBtn.x && mouseX <= pauseBtn.x + pauseBtn.w &&
        mouseY >= pauseBtn.y && mouseY <= pauseBtn.y + pauseBtn.h) {
        togglePause();
    }
}

function keyPressed() {
    if (key === 'r' || key === 'R') {
        resetGame();
        return;
    }

    if (key === 'p' || key === 'P') {
        togglePause();
        return;
    }

    if (paused || gameOver) {
        return;
    }

    // Build a retro wood cover wall toward mouse direction
    if ((key === 'b' || key === 'B') && player.mats >= 10) {
        var angle = atan2(mouseY - player.y, mouseX - player.x);
        walls.push({
            x: player.x + cos(angle) * 34,
            y: player.y + sin(angle) * 34,
            angle: angle,
            w: 12,
            h: 44,
            hp: 60
        });
        player.mats -= 10;
    }
}

function updateBullets() {
    for (var i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // Pixelated tracer bullet
        fill(255, 235, 60);
        noStroke();
        rect(b.x - 3, b.y - 3, 6, 6);

        var hit = false;

        // Check wall collision
        for (var w = walls.length - 1; w >= 0; w--) {
            if (dist(b.x, b.y, walls[w].x, walls[w].y) < 21) {
                walls[w].hp -= 15;
                if (walls[w].hp <= 0) {
                    walls.splice(w, 1);
                }
                hit = true;
                break;
            }
        }

        // Check enemy collision
        if (!hit) {
            for (var e = enemies.length - 1; e >= 0; e--) {
                if (dist(b.x, b.y, enemies[e].x, enemies[e].y) < enemies[e].size / 2 + 5) {
                    enemies[e].hp -= 15;
                    hit = true;
                    if (enemies[e].hp <= 0) {
                        enemies.splice(e, 1);
                        score += 100;
                        player.mats += 15;
                        spawnEnemy();
                    }
                    break;
                }
            }
        }

        if (hit || b.life <= 0) {
            bullets.splice(i, 1);
        }
    }
}

function drawWalls() {
    for (var i = 0; i < walls.length; i++) {
        var wall = walls[i];
        pushMatrix();
        translate(wall.x, wall.y);
        rotate(wall.angle);
        fill(180, 120, 60);
        stroke(85, 50, 20);
        strokeWeight(2);
        rectMode(CENTER);
        rect(0, 0, wall.w, wall.h);
        // Plank line
        line(-wall.w / 2 + 2, 0, wall.w / 2 - 2, 0);
        rectMode(CORNER);
        popMatrix();
    }
}

function updateEnemies() {
    for (var i = enemies.length - 1; i >= 0; i--) {
        var en = enemies[i];
        var angle = atan2(player.y - en.y, player.x - en.x);
        var nextX = en.x + cos(angle) * en.speed;
        var nextY = en.y + sin(angle) * en.speed;

        // Stop at built walls
        var blocked = false;
        for (var w = 0; w < walls.length; w++) {
            if (dist(nextX, nextY, walls[w].x, walls[w].y) < 19) {
                blocked = true;
                break;
            }
        }

        if (!blocked) {
            en.x = nextX;
            en.y = nextY;
            en.walkFrame += 0.25;
        }

        // Damage player on contact
        if (dist(en.x, en.y, player.x, player.y) < (en.size + player.size) / 2) {
            player.hp -= 0.5;
        }

        drawRetroPerson(
            en.x,
            en.y,
            angle,
            en.walkFrame,
            color(220, 55, 55),
            color(255, 145, 45),
            color(235, 180, 135),
            false
        );
    }
}

function drawRetroGround() {
    background(76, 158, 72);

    // Checkerboard retro grass tiles
    noStroke();
    var tileSize = 40;
    for (var gx = 0; gx < width; gx += tileSize) {
        for (var gy = 0; gy < height; gy += tileSize) {
            if (((gx / tileSize) + (gy / tileSize)) % 2 === 0) {
                fill(88, 174, 82);
                rect(gx, gy, tileSize, tileSize);
            }
        }
    }

    // Retro stone border
    noFill();
    stroke(55, 115, 52);
    strokeWeight(6);
    rect(3, 3, width - 6, height - 6);
}

function drawPauseButton() {
    var hover = mouseX >= pauseBtn.x && mouseX <= pauseBtn.x + pauseBtn.w &&
                mouseY >= pauseBtn.y && mouseY <= pauseBtn.y + pauseBtn.h;

    fill(hover ? color(65, 75, 100) : color(20, 24, 36));
    stroke(255, 215, 40);
    strokeWeight(2);
    rect(pauseBtn.x, pauseBtn.y, pauseBtn.w, pauseBtn.h, 4);

    fill(255, 215, 40);
    noStroke();
    textSize(11);
    textAlign(CENTER, CENTER);
    text(paused ? "RESUME" : "PAUSE", pauseBtn.x + pauseBtn.w / 2, pauseBtn.y + pauseBtn.h / 2 + 1);
    textAlign(LEFT, BASELINE);
}

function drawHUD() {
    fill(18, 22, 34, 220);
    stroke(255, 215, 40);
    strokeWeight(2);
    rect(8, 8, 185, 64, 4);

    noStroke();
    fill(255);
    textSize(12);
    text("HP: " + max(0, round(player.hp)), 16, 26);
    text("MATS: " + player.mats + " [B]", 16, 44);
    text("SCORE: " + score, 16, 62);

    drawPauseButton();

    fill(18, 22, 34, 200);
    rect(8, 376, 384, 18, 3);
    fill(255, 235, 120);
    textSize(10);
    text("WASD/ARROWS: MOVE | CLICK: SHOOT | B: WALL | P: PAUSE | R: RESET", 12, 389);
}

function drawPausedOverlay() {
    fill(15, 18, 28, 150);
    noStroke();
    rect(0, 0, width, height);

    fill(255, 215, 40);
    textSize(28);
    textAlign(CENTER, CENTER);
    text("PAUSED", 200, 180);

    fill(255);
    textSize(13);
    text("Click RESUME or press P to continue | Press R to reset", 200, 214);
    textAlign(LEFT, BASELINE);
}

var draw = function() {
    if (player.hp <= 0) {
        gameOver = true;
    }

    drawRetroGround();

    if (!gameOver) {
        if (!paused) {
            updatePlayer();
            updateBullets();
            updateEnemies();
        }
        drawWalls();
        drawPlayer();
        drawHUD();

        if (paused) {
            drawPausedOverlay();
        }
    } else {
        background(20, 20, 30);
        fill(255, 75, 75);
        textSize(28);
        textAlign(CENTER, CENTER);
        text("GAME OVER", 200, 165);

        fill(255, 215, 40);
        textSize(16);
        text("FINAL SCORE: " + score, 200, 205);

        fill(200);
        textSize(12);
        text("Press R to play again", 200, 235);
        textAlign(LEFT, BASELINE);
    }
};
  }
};
new Processing(document.getElementById('gameCanvas'), sketchProc);
document.getElementById('gameCanvas').addEventListener('click', function(){this.focus();});
</script></body></html>
