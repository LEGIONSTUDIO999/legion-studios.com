<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DINO SPANISH RUN | LEGION STUDIOS</title><style>
*{box-sizing:border-box}body{margin:0;background:#030806;color:#a5ff70;font-family:Arial;display:grid;place-items:center;min-height:100vh}
.wrap{width:min(96vw,620px)}h1{text-align:center;letter-spacing:3px;font-size:22px}canvas{width:100%;background:#101c16;border:1px solid #4dff78;display:block;touch-action:manipulation}
.controls{text-align:center;color:#b7cbb7;font-size:13px}button{background:#8dff59;border:0;padding:9px 14px;font-weight:bold;margin:6px;cursor:pointer}
</style></head><body><div class="wrap"><h1>DINO SPANISH RUN</h1><canvas id="g" width="600" height="320"></canvas><div class="controls">SPACE / UP = jump • P = pause • Answer the Spanish question to keep running.</div><div style="text-align:center"><button onclick="pauseGame()">PAUSE / RESUME</button><button onclick="restart()">RESTART</button></div></div><script>
const c=document.getElementById('g'),ctx=c.getContext('2d');let dinoY=245,vy=0,ob=[],score=0,streak=0,speed=4,paused=false,dead=false,question=null,answering=false,frame=0;
const qa=[['hola','hello','goodbye','please'],['gracias','thank you','sorry','water'],['perro','dog','cat','house'],['agua','water','bread','school'],['libro','book','car','friend'],['rojo','red','green','blue'],['gato','cat','dog','bird'],['adiós','goodbye','hello','thanks']];
let qidx=0;
function ask(){question=qa[qidx++%qa.length];answering=true;paused=true;draw()}
function jump(){if(!paused&&!dead&&dinoY>=244)vy=-12}
function key(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.key.toLowerCase()==='p')pauseGame();if(answering&&['1','2','3'].includes(e.key))choose(+e.key-1)}
window.addEventListener('keydown',key);
function pauseGame(){if(dead)return;if(answering)return;paused=!paused;if(!paused)loop()}
function choose(n){if(!answering)return;let ok=question[n+1]===question[1];if(ok){score+=10;streak++;if(streak%5===0)speed+=1}else{streak=0}answering=false;paused=false;question=null;loop()}
function restart(){dinoY=245;vy=0;ob=[];score=0;streak=0;speed=4;paused=false;dead=false;answering=false;question=null;frame=0;loop()}
function draw(){ctx.fillStyle='#111b16';ctx.fillRect(0,0,600,320);ctx.fillStyle='#315d37';ctx.fillRect(0,270,600,50);ctx.fillStyle='#9cff64';ctx.font='16px Arial';ctx.fillText('SCORE '+score+'   STREAK '+streak,15,25);
ctx.fillStyle='#a6ff68';ctx.fillRect(70,dinoY,34,28);ctx.fillRect(92,dinoY-12,22,18);ctx.fillStyle='#0a180d';ctx.fillRect(107,dinoY-7,4,4);
ctx.fillStyle='#f0a24c';ob.forEach(o=>ctx.fillRect(o.x,270-o.h,o.w,o.h));
if(paused&&!answering){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,600,320);ctx.fillStyle='white';ctx.font='bold 28px Arial';ctx.fillText('PAUSED',245,150)}
if(answering){ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(0,0,600,320);ctx.fillStyle='#a4ff70';ctx.font='bold 22px Arial';ctx.fillText('What does "'+question[0]+'" mean?',55,100);ctx.font='18px Arial';question.slice(1).forEach((a,i)=>ctx.fillText((i+1)+'. '+a,90,155+i*38));ctx.font='13px Arial';ctx.fillText('Press 1, 2, or 3 to answer',190,285)}
if(dead){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,600,320);ctx.fillStyle='#ff6b6b';ctx.font='bold 30px Arial';ctx.fillText('RUN OVER',220,145);ctx.fillStyle='white';ctx.font='17px Arial';ctx.fillText('Final score: '+score+' • Press RESTART',180,180)}}
function loop(){if(paused||dead)return;frame++;ctx.clearRect(0,0,600,320);vy+=.65;dinoY+=vy;if(dinoY>245){dinoY=245;vy=0}if(frame%90===0)ob.push({x:620,w:20+Math.random()*18,h:25+Math.random()*25});ob.forEach(o=>o.x-=speed);ob=ob.filter(o=>o.x>-50);for(let o of ob){if(o.x<104&&o.x+o.w>70&&dinoY+28>270-o.h){dead=true}}draw();if(frame%450===0&&!dead){ask();return}requestAnimationFrame(loop)}
draw();loop();
</script></body></html>
